# Alert rules. Thresholds are in the series' own unit (FRED spreads are in %,
# so 0.75 = 75 bps) unless `relative: true`, where they are fractions.
# `series` may end in * to match every series with that prefix.
# These are monitoring thresholds, not validated predictive signals.
rules:
  - id: hy_oas_widening
    type: change
    series: fred.BAMLH0A0HYM2
    window_days: 91
    threshold: 0.75
    direction: up
    severity: warning
    description: Junk-bond borrowing costs rose 0.75 percentage points or more in about 3 months.

  - id: hy_oas_sharp_widening
    type: change
    series: fred.BAMLH0A0HYM2
    window_days: 91
    threshold: 1.5
    direction: up
    severity: critical
    description: Junk-bond borrowing costs jumped 1.5 percentage points or more in about 3 months.

  - id: ccc_oas_widening
    type: change
    series: fred.BAMLH0A3HYC
    window_days: 91
    threshold: 2.0
    direction: up
    severity: warning
    description: Borrowing costs for the riskiest companies rose 2 percentage points or more in about 3 months. They are usually the first to be cut off.

  - id: bbb_oas_widening
    type: change
    series: fred.BAMLC0A4CBBB
    window_days: 91
    threshold: 0.4
    direction: up
    severity: info
    description: Borrowing costs for safer (BBB-rated) companies rose 0.4 percentage points or more in about 3 months. Stress is reaching mainstream borrowers.

  - id: hy_oas_elevated
    type: level
    series: fred.BAMLH0A0HYM2
    above: 5.0
    severity: info
    cooldown_days: 90
    description: Junk-bond borrowing costs are above 5 percentage points, about their long-run average. Debt is no longer cheap for riskier companies.

  - id: multi_indicator_deterioration
    type: breadth
    rules:
      - hy_oas_widening
      - ccc_oas_widening
      - bbb_oas_widening
    min_rules: 2
    window_days: 60
    severity: critical
    description: Several separate borrowing-cost warnings fired within 60 days.

  - id: gpu_list_price_cut
    type: change
    series: aws.*
    window_days: 182
    threshold: 0.15
    relative: true
    direction: down
    severity: info
    cooldown_days: 180
    description: An AWS GPU list price fell 15% or more in about 6 months. Newer chips can cause this, not only weak demand.

  - id: azure_spot_cut
    type: change
    series: azure.*.spot
    window_days: 91
    threshold: 0.2
    relative: true
    direction: down
    severity: info
    cooldown_days: 90
    description: An Azure GPU spot price fell 20% or more in about 3 months. Falling spot prices can mean idle capacity.
