  # ---------------------------------------------------------------- CoreWeave loan facilities
  - id: issuer_debt.CRWV.revolver.sofr_spread
    indicator: credit
    label: CoreWeave revolving credit facility, margin over term SOFR
    entity: CoreWeave, Inc.
    source: CoreWeave Form 8-K Exhibit 10.1 (Amendment No. 3 to Revolving Credit and Guaranty Agreement)
    source_url: https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=0001769628&type=8-K
    unit: "%"
    currency: null
    cadence: irregular
    methodology: &m_sofr >-
      Applicable margin, in percentage points, over SOFR for SOFR-based loans under the facility,
      as stated in the Form 8-K or prospectus describing the credit agreement at signing or
      amendment (e.g. "SOFR plus 4.00%" -> 4.0). These are contract terms at signing, NOT market
      spreads, and they are not updated for later amendments unless separately recorded. The SOFR
      variant (term SOFR vs daily compounded SOFR) differs by facility; see note. Facilities whose
      margin is a grid or range (e.g. the original DDTL 2.0) are not recorded.
    observations:
      - period_start: 2025-05-02
        period_end: 2025-05-02
        value: 1.75
        as_of: 2025-05-06
        source_url: https://www.sec.gov/Archives/edgar/data/1769628/000176962825000003/coreweavercf-amendmentno.htm
        quote: "Term Benchmark Loans and RFR Loans Base Rate Loans 1.75% 0.75%"
        note: >-
          Quote is the "Applicable Rate" table in the conformed credit agreement attached to
          Amendment No. 3 (2025-05-02), which raised the facility to $1.5bn and extended maturity
          to 2028-05-02. The IPO prospectus (424B4, 2025-03-31) states the same 1.75% margin over
          term SOFR for term benchmark loans. The November 2025 amendment (facility raised to
          $2.5bn, maturity November 2029, per the FY2025 10-K) was not filed on 8-K; its margin is
          not verified. Undrawn fee 0.25% per annum (10-K).

