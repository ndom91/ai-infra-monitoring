# Issue terms of neocloud / AI-infrastructure debt: note coupons at issuance and
# term-loan SOFR margins at signing. These are contract terms, not market prices.
# Sources: SEC EDGAR 8-K / 6-K filings and issuer investor-relations releases.
# The three methodology texts are YAML anchors (&m_note, &m_conv, &m_sofr) defined at first use.

series:
  # ---------------------------------------------------------------- CoreWeave notes
  - id: issuer_debt.CRWV.notes_2030_9_25.coupon
    indicator: credit
    label: CoreWeave 9.250% senior notes due 2030, coupon at issue
    entity: CoreWeave, Inc.
    source: CoreWeave press release (SEC Form 8-K Exhibit 99.1)
    source_url: https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=0001769628&type=8-K
    unit: "%"
    currency: null
    cadence: irregular
    methodology: &m_note >-
      Coupon (stated annual interest rate, %) of the note at issuance, as stated in the issuer's
      pricing or closing announcement / Form 8-K or 6-K. These are issue terms (coupon at
      issuance), NOT trading yields or spreads; they do not move with market prices and are not
      updated after issue. One observation per note series, dated at the issue (closing) date;
      as_of is the date of the cited document. Add-on issuances of the same series keep the same
      coupon and are described in the note rather than recorded again. When the issue price is not
      par, the yield at issue differs from the coupon (issue price is given in the note).
    observations:
      - period_start: 2025-05-27
        period_end: 2025-05-27
        value: 9.25
        as_of: 2025-05-21
        source_url: https://www.sec.gov/Archives/edgar/data/1769628/000176962825000019/coreweave-pressreleasepric.htm
        quote: "priced a private offering of $2,000 million aggregate principal amount of 9.250% senior notes due 2030"
        note: >-
          Priced 2025-05-21, closed 2025-05-27 (8-K filed 2025-05-28). Principal $2,000m (upsized
          from $1,500m), issued at par, senior unsecured, maturity 2030-06-01, guaranteed by
          CoreWeave Cash Management LLC. Use of proceeds: general corporate purposes including
          repayment of outstanding indebtedness. Ratings at launch (2025-05-19, for the proposed
          $1.5bn notes): Moody's B1 (CFR Ba3), S&P B (issuer B+), Fitch BB- (IDR BB-, RR4).
          Secondary source for ratings: Investing.com articles of 2025-05-19 citing each agency
          (https://www.investing.com/news/stock-market-news/coreweave-gets-ba3-cfr-from-moodys-15bn-senior-unsecured-notes-rated-b1-93CH-4053767,
          https://www.investing.com/news/stock-market-news/coreweave-receives-b-issuer-credit-rating-at-sp-15-billion-debt-rated-b-93CH-4053492,
          https://www.investing.com/news/stock-market-news/fitch-awards-firsttime-bb-rating-to-coreweave-15-billion-senior-notes-included-93CH-4053125).

