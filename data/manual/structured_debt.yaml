# Structured and asset-backed debt behind AI infrastructure: GPU-collateralised delayed-draw
# term loans (CoreWeave, Lambda), a data-center credit facility (Crusoe) and data-center ABS
# (Vantage, Switch, Aligned, STACK). Facility / issue size and contract terms at closing, taken
# from SEC filings and issuer press releases. These are issue terms, NOT market prices, and not
# amounts drawn or outstanding. CoreWeave DDTL margins over SOFR are in issuer_debt.yaml.
# Methodology texts are YAML anchors (&m_size, &m_coupon, &m_margin) defined at first use.

series:
  # ---------------------------------------------------------------- CoreWeave DDTL sizes
  - id: structured_debt.CRWV.ddtl_1_0.principal
    indicator: credit
    label: CoreWeave DDTL 1.0 facility, committed size
    entity: CoreWeave Compute Acquisition Co. II, LLC (CoreWeave)
    source: CoreWeave IPO prospectus (Form 424B4)
    source_url: https://www.sec.gov/Archives/edgar/data/1769628/000119312525067651/d899798d424b4.htm
    unit: USD m
    currency: USD
    cadence: irregular
    methodology: &m_size >-
      Maximum committed principal of the facility or issue, in millions of the stated currency, as
      stated in the filing or press release that describes it. This is facility size at closing:
      for delayed-draw loans and variable-funding facilities it is the commitment, NOT the amount
      drawn or outstanding, and it is not updated for later amendments unless separately
      recorded. For ABS it is the aggregate principal of the notes issued in that transaction (a
      tap is its own observation). One observation per deal, dated at the closing or announcement
      date given in the note; as_of is the date of the cited document.
    observations:
      - period_start: 2023-07-30
        period_end: 2023-07-30
        value: 2300
        as_of: 2025-03-31
        source_url: https://www.sec.gov/Archives/edgar/data/1769628/000119312525067651/d899798d424b4.htm
        quote: "provides for a delayed draw term loan facility of up to $2.3 billion"
        note: >-
          Facility entered July 2023 (same date as the margin observation in issuer_debt.yaml). The
          prospectus describes it "as amended". Secured by substantially all of the borrower
          subsidiary's assets and a pledge of its equity (GPU-collateralised); unconditionally
          guaranteed by CoreWeave. The prospectus says $2.3 billion was secured through DDTL 1.0 in
          July 2023.

  - id: structured_debt.CRWV.ddtl_2_0.principal
    indicator: credit
    label: CoreWeave DDTL 2.0 facility, committed size (as of the IPO prospectus)
    entity: CoreWeave Compute Acquisition Co. IV, LLC (CoreWeave)
    source: CoreWeave IPO prospectus (Form 424B4)
    source_url: https://www.sec.gov/Archives/edgar/data/1769628/000119312525067651/d899798d424b4.htm
    unit: USD m
    currency: USD
    cadence: irregular
    methodology: *m_size
    observations:
      - period_start: 2024-05-01
        period_end: 2024-05-01
        value: 7600
        as_of: 2025-03-31
        source_url: https://www.sec.gov/Archives/edgar/data/1769628/000119312525067651/d899798d424b4.htm
        quote: "providing for up to $7.6 billion in delayed draw terms loans"
        note: >-
          The prospectus says only that the facility was entered into "In May 2024" (first
          announced May 2024), so the period uses the first day of the month. The size is the
          commitment after amendments as of the prospectus date (the quote reproduces the
          prospectus wording, including its "terms" typo). The prospectus also says the DDTL 2.0
          "first announced in May 2024" secured $7.6 billion of commitments. The later $3.0bn
          incremental tranche (Fifth Amendment) is a separate series. Guaranteed by CoreWeave. The
          original DDTL 2.0 margin is a grid and is not recorded in issuer_debt.yaml.

