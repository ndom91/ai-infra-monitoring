  # ---------------------------------------------------------------- Lambda, Crusoe
  - id: structured_debt.LAMBDA.gpu_spv_2024.principal
    indicator: credit
    label: Lambda GPU-backed financing vehicle (Macquarie-led), size
    entity: Lambda, Inc.
    source: Lambda press release (Business Wire), syndicated copy on The AI Journal
    source_url: https://aijourn.com/lambda-announces-500m-gpu-backed-facility-to-expand-cloud-for-ai/
    unit: USD m
    currency: USD
    cadence: irregular
    methodology: *m_size
    observations:
      - period_start: 2024-04-04
        period_end: 2024-04-04
        value: 500
        as_of: 2024-04-04
        source_url: https://aijourn.com/lambda-announces-500m-gpu-backed-facility-to-expand-cloud-for-ai/
        quote: "special purpose GPU financing vehicle of up to $500 million"
        note: >-
          Secondary copy of the Business Wire release (the Business Wire page returned 403); the
          copy is dated 4 April 2024, and the Business Wire URL id suggests 2 April, so the date
          used is the date of the page read. Led by Macquarie Group with participation from
          Industrial Development Funding. "Secured by the GPUs and supported by their cash flow
          generation." No pricing, advance rate or maturity stated. Lambda has no SEC filings.

  - id: structured_debt.LAMBDA.tlb_2026.principal
    indicator: credit
    label: Lambda $926 million senior secured term loan B (GPU asset-backed SPV), size
    entity: Lambda, Inc.
    source: Lambda press release (Business Wire), syndicated copy on Yahoo Finance
    source_url: https://finance.yahoo.com/technology/ai/articles/lambda-closes-926-million-senior-200000756.html
    unit: USD m
    currency: USD
    cadence: irregular
    methodology: *m_size
    observations:
      - period_start: 2026-08-27
        period_end: 2026-08-27
        value: 926
        as_of: 2026-08-27
        source_url: https://finance.yahoo.com/technology/ai/articles/lambda-closes-926-million-senior-200000756.html
        quote: "today announced the closing of its $926 million senior secured term loan B facility"
        note: >-
          Closing announced 2026-08-27; first priced 2026-08-12. Funds purchase and deployment of
          GPU infrastructure for a committed customer deployment with an investment-grade offtaker.
          Moody's Baa2. Matures 2030-12-31 on a fully amortizing schedule; secured by the GPU
          servers and related infrastructure and the cash flows they generate. Issued at 99.5% of
          principal. Morgan Stanley lead left arranger and administrative agent. No advance rate
          or loan-to-value stated.

  - id: structured_debt.LAMBDA.tlb_2026.sofr_spread
    indicator: credit
    label: Lambda $926 million term loan B, margin over SOFR
    entity: Lambda, Inc.
    source: Lambda press release (Business Wire), syndicated copy on Yahoo Finance
    source_url: https://finance.yahoo.com/technology/ai/articles/lambda-closes-926-million-senior-200000756.html
    unit: "%"
    currency: null
    cadence: irregular
    methodology: &m_margin >-
      Margin, in percentage points, over SOFR at pricing, as stated in the issuer's announcement
      (e.g. "SOFR + 3.00%" -> 3.0). This is the contract price at launch, NOT a market spread or
      trading yield, and it is not updated for later events. As_of is the date of the cited
      document.
    observations:
      - period_start: 2026-08-27
        period_end: 2026-08-27
        value: 3.0
        as_of: 2026-08-27
        source_url: https://finance.yahoo.com/technology/ai/articles/lambda-closes-926-million-senior-200000756.html
        quote: "The Facility was priced at SOFR + 3.00%, and issued at 99.5% of the principal amount."
        note: >-
          Priced 2026-08-12 (per the release), closing announced 2026-08-27; the period uses the
          closing announcement date. Issue price 99.5% of principal. The release does not say
          whether the SOFR is term or daily compounded.

