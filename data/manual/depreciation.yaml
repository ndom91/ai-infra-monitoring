        note: Network equipment 4 -> 6 years, effective beginning fiscal year 2023. Estimated +$3.7B FY2023 operating income (combined, same page).

  # ---------------------------------------------------------------- Oracle
  - id: depreciation.ORCL.server_useful_life
    indicator: depreciation
    label: Oracle estimated useful life of servers (and networking equipment from FY2025)
    entity: Oracle
    source: Oracle Corporation SEC filings (10-Q, 10-K)
    source_url: https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=0001341439&type=10-K
    unit: years
    cadence: irregular
    methodology: >
      Oracle's fiscal year starts June 1. Changes were effective at the beginning of fiscal
      2023 (2022-06-01) and fiscal 2025 (2024-06-01). The FY2023 change covers servers; the
      FY2025 change covers "servers and networking equipment". The 10-K property table only
      gives a range ("Computer, network, machinery and equipment 1 - 5/6 years"), so the
      baseline is the pre-change life stated in the FY2023 Q1 10-Q, dated the day before.
    observations:
      - period_start: 2022-05-31
        period_end: 2022-05-31
        value: 4
        as_of: 2022-09-13
        source_url: https://www.sec.gov/Archives/edgar/data/1341439/000156459022031545/orcl-10q_20220831.htm
        quote: "During the first quarter of fiscal 2023, we completed an assessment of the useful lives of our servers and increased the estimate of the useful lives from four years to five years effective at the beginning of fiscal 2023."
        note: Baseline as disclosed in the Q1 FY2023 10-Q (pre-change server life, "from four years").
      - period_start: 2022-06-01
        period_end: 2022-06-01
        value: 5
        as_of: 2022-09-13
        source_url: https://www.sec.gov/Archives/edgar/data/1341439/000156459022031545/orcl-10q_20220831.htm
        quote: "During the first quarter of fiscal 2023, we completed an assessment of the useful lives of our servers and increased the estimate of the useful lives from four years to five years effective at the beginning of fiscal 2023."
        note: Servers 4 -> 5 years. Same page - decreased total operating expenses by $131M in Q1 FY2023.
      - period_start: 2024-06-01
        period_end: 2024-06-01
        value: 6
        as_of: 2024-09-10
        source_url: https://www.sec.gov/Archives/edgar/data/1341439/000095017024104905/orcl-20240831.htm
        quote: "During the first quarter of fiscal 2025, we completed an assessment of the useful lives of our servers and networking equipment and increased the estimate of the useful lives from five years to six years, effective at the beginning of fiscal 2025."
        note: Servers and networking equipment 5 -> 6 years. Same page - Q1 FY2025 impact $197M lower operating expenses, +$157M net income, +$0.06 EPS. FY2026 10-K and Q1 FY2027 10-Q still state six years.

