# American Compute GPU Resale Index. The index page and the CSV both state
# "Free to use with attribution." That feature-specific grant is what permits
# reuse; the site-wide Terms of Use otherwise limit use to personal,
# noncommercial access. Attribution: American Compute, GPU Resale Index,
# https://www.amcompute.com/gpu-resale-index
series:
  - id: gpu_resale.amcompute.basket_index
    indicator: gpu_resale
    label: American Compute GPU Resale Index (used data center GPU basket, H1 2025 = 100)
    entity: Used data center GPU basket (T4 to H100, aged 2.5 to 8 years)
    source: American Compute GPU Resale Index (Rack Report)
    source_url: https://www.amcompute.com/gpu-resale-index
    unit: index (H1 2025 = 100)
    currency: null
    cadence: monthly
    methodology: >-
      Value type: index of completed (realized) sale prices, expressed relative
      to price new. Not asking prices, not dealer buyback offers, not model
      estimates. Published definition: "What a fixed basket of used data center
      GPUs aged 2.5 to 8 years, from the T4 to the H100, sells for as a share of
      its price new. H1 2025 = 100." The Rack Report describes its figures as
      prices "from realized sales". Published monthly on the first of each month
      with the Rack Report. Caveats: the publisher does not disclose sample
      size, sales sources, basket composition or weights, condition grades, or
      SXM vs PCIe / per-GPU vs per-server mix; there is no per-model USD price.
      The publisher states "An issue can restate recent months as late sales
      come in", so recent months may be revised. The publisher also reports a
      vs-baseline column (premium/discount to "normal depreciation"), not
      recorded here because "normal depreciation" is not defined. The
      residual-value bands on the same page are forward estimates and are not
      recorded. Free to use with attribution (stated on the index page and in
      the CSV header).
