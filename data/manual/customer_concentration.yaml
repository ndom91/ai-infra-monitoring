        period_end: 2023-12-31
        value: 21
        as_of: 2025-03-03
        source_url: https://www.sec.gov/Archives/edgar/data/1769628/000119312525044231/d899798ds1.htm
        quote: "The following customers accounted for 10% or more of the Company’s revenue for the years ended December 31, 2022, 2023, and 2024: ... Customer B * 21 % * Customer C * 17 % 15 %"
