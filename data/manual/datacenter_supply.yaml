# Data-center supply/demand fundamentals from CBRE and JLL North America reports.
# CBRE and JLL use different market definitions and are never merged.
# JLL changed its coverage twice (U.S.-only colocation in H1 2024, North America
# colocation YE2024-H1 2025, expanded hyperscale + 40 frontier markets from YE2025),
# so each JLL scope is its own series family.

series:
  # ---------------------------------------------------------------- CBRE
  - id: cbre.na_primary.vacancy
    indicator: vacancy
    label: CBRE North America primary-market data-center vacancy
    entity: North America primary markets (CBRE)
    source: CBRE North America Data Center Trends
    source_url: https://www.cbre.com/insights/data-center
    unit: "%"
    currency: null
    cadence: semiannual
    methodology: >
      Overall vacancy rate across CBRE's primary wholesale colocation data-center
      markets at the end of each half-year, as stated in the semiannual North America
      Data Center Trends report covering that half. Market definition change: through
      the H2 2022 report CBRE had seven primary markets (Northern Virginia, Dallas,
      Silicon Valley, Chicago, Phoenix, New York Tri-State, Atlanta); from the H1 2023
      report onward it uses eight, adding Hillsboro, OR. CBRE periodically revises
      inventory and absorption history (e.g. H1 2025 report), so later reports may
      restate earlier periods.
    observations:
      - period_start: 2022-01-01
        period_end: 2022-06-30
        value: 3.8
        as_of: 2022-09-09
        source_url: https://www.cbre.com/insights/reports/north-america-data-center-trends-h1-2022
        quote: "The overall vacancy rate for primary markets is at a record-low 3.8%."
        note: Seven primary markets (Hillsboro not yet included).
      - period_start: 2022-07-01
        period_end: 2022-12-31
        value: 3.2
        as_of: 2023-02-17
        source_url: https://www.cbre.com/insights/reports/north-america-data-center-trends-h2-2022
        quote: "The overall vacancy rate in primary markets is a record-low 3.2%."
        note: Seven primary markets (Hillsboro not yet included).
      - period_start: 2023-01-01
        period_end: 2023-06-30
        value: 3.3
        as_of: 2023-09-06
        source_url: https://www.cbre.com/insights/reports/north-america-data-center-trends-h1-2023
        quote: "The overall vacancy rate for primary markets remains near a record low, at 3.3%."
        note: First report with eight primary markets (Hillsboro added). Also restated as "3.3% a year earlier" in the H1 2024 report.
      - period_start: 2023-07-01
        period_end: 2023-12-31
        value: 3.7
        as_of: 2024-03-06
        source_url: https://www.cbre.com/insights/reports/north-america-data-center-trends-h2-2023
        quote: "The overall vacancy rate for primary markets remains near a record low, at 3.7%."
      - period_start: 2024-01-01
        period_end: 2024-06-30
        value: 2.8
        as_of: 2024-08-19
        source_url: https://www.cbre.com/insights/reports/north-america-data-center-trends-h1-2024
        quote: "The overall vacancy rate for primary markets fell to a record-low 2.8% in H1 2024 from 3.3% a year earlier"
      - period_start: 2024-07-01
        period_end: 2024-12-31
        value: 1.9
        as_of: 2025-02-26
        source_url: https://www.cbre.com/insights/reports/north-america-data-center-trends-h2-2024
        quote: "The overall vacancy rate in primary markets fell to a record-low 1.9% at year-end."
      - period_start: 2025-01-01
        period_end: 2025-06-30
        value: 1.6
        as_of: 2025-09-08
        source_url: https://www.cbre.com/insights/reports/north-america-data-center-trends-h1-2025
        quote: "Despite this significant increase in inventory, primary market vacancy dropped to a record-low 1.6%"
        note: Also restated as "1.6% in H1 2025" in the H1 2026 report. Highlights brief published 2025-08-19.
      - period_start: 2025-07-01
        period_end: 2025-12-31
        value: 1.4
        as_of: 2026-02-25
        source_url: https://www.cbre.com/insights/books/north-america-data-center-trends-h2-2025
        quote: "The overall vacancy rate in primary markets fell to a record low 1.4% at year-end."
      - period_start: 2026-01-01
        period_end: 2026-06-30
        value: 1.4
        as_of: 2026-08-27
        source_url: https://www.cbre.com/insights/books/north-america-data-center-trends-h1-2026
        quote: "Despite record supply, primary market vacancy fell to a record low of 1.4% in H1 from 1.6% in H1 2025"
        note: The H1 2026 press release says "Vacancy held steady at 1.4% compared with year-end 2025."

  - id: cbre.na_primary.net_absorption_mw
    indicator: vacancy
    label: CBRE North America primary-market half-year net absorption
    entity: North America primary markets (CBRE)
    source: CBRE North America Data Center Trends
    source_url: https://www.cbre.com/insights/data-center
    unit: MW
    currency: null
    cadence: semiannual
    methodology: >
      Net absorption (MW) across CBRE's primary wholesale colocation markets during the
      half-year, as stated in the report covering that half. H2 reports usually state
      full-year absorption instead (see cbre.na_primary.net_absorption_mw_annual).
      Seven primary markets through H2 2022, eight (adds Hillsboro) from H1 2023.
    observations:
      - period_start: 2021-07-01
        period_end: 2021-12-31
        value: 351.7
        as_of: 2022-03-21
        source_url: https://www.cbre.com/insights/reports/north-america-data-center-trends-h2-2021
        quote: "Cumulative net absorption across primary markets in H2 2021 totaled 351.7 MW, up 158.5 MW year-over-year."
        note: Seven primary markets.
      - period_start: 2022-01-01
        period_end: 2022-06-30
        value: 453.4
        as_of: 2022-09-09
        source_url: https://www.cbre.com/insights/reports/north-america-data-center-trends-h1-2022
        quote: "Net absorption across primary markets nearly tripled year-over-year in H1 to 453.4 MW, almost 60% of it in Northern Virginia."
        note: Seven primary markets. The H1 2023 report (eight markets) restates H1 2022 absorption as 484.8 MW.
      - period_start: 2023-01-01
        period_end: 2023-06-30
        value: 468.8
        as_of: 2023-09-06
        source_url: https://www.cbre.com/insights/reports/north-america-data-center-trends-h1-2023
        quote: "It totaled 468.8 MW, compared to 484.8 MW absorbed in H1 2022."
        note: Eight primary markets. "It" refers to primary-market absorption in H1 2023.
      - period_start: 2026-01-01
        period_end: 2026-06-30
        value: 1456.2
        as_of: 2026-08-27
        source_url: https://www.cbre.com/insights/books/north-america-data-center-trends-h1-2026
        quote: "Net absorption across primary markets increased by 11.7% year-over-year to 1,456.2 MW in H1."

  - id: cbre.na_primary.net_absorption_mw_annual
    indicator: vacancy
    label: CBRE North America primary-market full-year net absorption
    entity: North America primary markets (CBRE)
    source: CBRE North America Data Center Trends
    source_url: https://www.cbre.com/insights/data-center
    unit: MW
    currency: null
    cadence: annual
    methodology: >
      Calendar-year net absorption (MW) across CBRE's primary wholesale colocation
      markets, as stated in the H2 (year-end) report or its press release. Seven
      primary markets for 2022, eight (adds Hillsboro) from 2023.
    observations:
      - period_start: 2022-01-01
        period_end: 2022-12-31
        value: 686.9
        as_of: 2023-02-17
        source_url: https://www.cbre.com/insights/reports/north-america-data-center-trends-h2-2022
        quote: "Primary markets saw 686.9 MW of positive absorption in 2022, up 193.6 MW (39.1%) from 2021."
        note: Seven primary markets.
      - period_start: 2024-01-01
        period_end: 2024-12-31
        value: 1809.5
        as_of: 2025-03-06
        source_url: https://www.cbre.com/press-releases/north-american-data-center-construction-hit-new-heights-in-2024-amid-surging-demand-washington
        quote: "Primary market net absorption jumped from 329.6 MW in 2020 to 1,809.5 MW in 2024—a 450% increase in just four years."
        note: CBRE press release for the H2 2024 report; the H2 2025 report restates 2024 as 1,809.5 MW.
      - period_start: 2025-01-01
        period_end: 2025-12-31
        value: 2497.6
        as_of: 2026-02-25
        source_url: https://www.cbre.com/insights/books/north-america-data-center-trends-h2-2025
        quote: "Primary markets posted record net absorption of 2,497.6 MW in 2025, outpacing the previous record of 1,809.5 MW in 2024."

  - id: cbre.na_primary.under_construction_mw
    indicator: construction
    label: CBRE North America primary-market capacity under construction
    entity: North America primary markets (CBRE)
    source: CBRE North America Data Center Trends
    source_url: https://www.cbre.com/insights/data-center
    unit: MW
    currency: null
    cadence: semiannual
    methodology: >
      Wholesale colocation capacity (MW) under construction across CBRE's primary
      markets at the end of each half-year, as stated in the report covering that half.
      Seven primary markets through H2 2022, eight (adds Hillsboro) from H1 2023.
      Later reports sometimes restate earlier periods on the newer basis; see notes.
    observations:
      - period_start: 2021-07-01
        period_end: 2021-12-31
        value: 727.6
        as_of: 2022-03-21
        source_url: https://www.cbre.com/insights/reports/north-america-data-center-trends-h2-2021
        quote: "with 321.7 MW of the 727.6 MW (44.2%) of under-construction capacity preleased."
        note: Seven primary markets. The same report also rounds this to "another 728 MW of capacity is under construction".
      - period_start: 2022-01-01
        period_end: 2022-06-30
        value: 1601.5
        as_of: 2022-09-09
        source_url: https://www.cbre.com/insights/reports/north-america-data-center-trends-h1-2022
        quote: "The construction pipeline within primary markets more than doubled year-over-year to 1,601.5 MW."
        note: Seven primary markets. The H1 2023 press release (eight markets) restates H1 2022 as 1,830.3 MW.
      - period_start: 2022-07-01
        period_end: 2022-12-31
        value: 1839.9
        as_of: 2023-02-17
        source_url: https://www.cbre.com/insights/reports/north-america-data-center-trends-h2-2022
        quote: "the construction pipeline within primary markets increased 153% year-over-year, to 1,839.9 MW."
        note: Seven primary markets. The H2 2023 press release (eight markets) restates year-end 2022 as 2,109.2 MW.
      - period_start: 2023-01-01
        period_end: 2023-06-30
        value: 2287.6
        as_of: 2023-09-06
        source_url: https://www.cbre.com/insights/reports/north-america-data-center-trends-h1-2023
        quote: "An all-time high of 2,287.6 MW was under construction in primary markets, a 25% year-over-year increase."
        note: First report with eight primary markets (Hillsboro added).
      - period_start: 2023-07-01
        period_end: 2023-12-31
        value: 3077.8
        as_of: 2024-03-06
        source_url: https://www.cbre.com/insights/reports/north-america-data-center-trends-h2-2023
        quote: "An all-time high of 3,077.8 MW was under construction in primary markets, a 46% year-over-year increase."
        note: The H2 2024 report also restates year-end 2023 as 3,077.8 MW, but the H1 2025 report cites "H2 2023's total of 3,245.2 MW" (apparent revision).
      - period_start: 2024-01-01
        period_end: 2024-06-30
        value: 3871.8
        as_of: 2024-08-19
        source_url: https://www.cbre.com/insights/reports/north-america-data-center-trends-h1-2024
        quote: "Under-construction activity in primary markets hit a record-high 3,871.8 MW, up by 69% from a year earlier."
      - period_start: 2024-07-01
        period_end: 2024-12-31
        value: 6350.1
        as_of: 2025-03-06
        source_url: https://www.cbre.com/press-releases/north-american-data-center-construction-hit-new-heights-in-2024-amid-surging-demand-washington
        quote: "a record 6,350.1 megawatts (MW)—a 12-fold increase from the 456.8 MW under construction in 2020"
        note: The H2 2024 report itself (published 2025-02-26) rounds this to "a record 6,350 MW under construction at the end of 2024"; the press release, H2 2025 and H1 2026 reports give 6,350.1 MW.
      - period_start: 2025-01-01
        period_end: 2025-06-30
        value: 5242.5
        as_of: 2025-09-08
        source_url: https://www.cbre.com/insights/reports/north-america-data-center-trends-h1-2025
        quote: "Total under-construction capacity across primary markets reached 5,242.5 MW in H1 2025,"
      - period_start: 2025-07-01
        period_end: 2025-12-31
        value: 5994.4
        as_of: 2026-02-25
        source_url: https://www.cbre.com/insights/books/north-america-data-center-trends-h2-2025
        quote: "There were 5,994.4 MW under construction at the end of 2025, down from 6,350.1 MW in 2024."
      - period_start: 2026-01-01
        period_end: 2026-06-30
        value: 7481.1
        as_of: 2026-08-27
        source_url: https://www.cbre.com/insights/books/north-america-data-center-trends-h1-2026
        quote: "Total under-construction capacity across primary markets increased by 24.8% in H1 to a record high of 7,481.1 MW."
        note: The 24.8% increase is versus year-end 2025 (5,994.4 MW), not year-over-year.

