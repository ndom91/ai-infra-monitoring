name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build first: it generates src/routeTree.gen.ts, which typecheck needs.
      - run: pnpm build
      # Server-only code in the client bundle breaks hydration silently.
      - run: pnpm check:bundle
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # Every manual value needs a source URL and a verbatim quote.
      - run: pnpm check:manual
