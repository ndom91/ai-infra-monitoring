name: Collect SEC fundamentals
on:
  schedule:
    # Daily check; data only changes after 10-Q/10-K filings, and unchanged
    # values are not re-inserted.
    # Offset from the hour to reduce GitHub Actions schedule drops.
    - cron: "13 8 * * 1-5"
  workflow_dispatch:
jobs:
  sec:
    uses: ./.github/workflows/_collect.yml
    with:
      collectors: sec
    secrets: inherit
