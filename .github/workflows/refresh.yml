name: Refresh public market data
on:
  schedule:
    - cron: "40 9 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # No install needed: the script only uses Node built-ins.
      - run: node scripts/refresh-data.ts
      - name: Commit refreshed observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/observations.json
          git diff --cached --quiet || (git commit -m "Refresh market observations" && git push)
