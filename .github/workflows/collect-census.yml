name: Collect Census construction spending
on:
  schedule:
    # Weekdays at 15:23 UTC. Census releases C30 at 10:00 ET (14:00 or 15:00 UTC
    # depending on daylight saving), so this runs after the release either way.
    # Off-minute to avoid GitHub's busiest scheduler minute.
    - cron: "23 15 * * 1-5"
  workflow_dispatch:
jobs:
  census:
    uses: ./.github/workflows/_collect.yml
    with:
      collectors: census
    secrets: inherit
